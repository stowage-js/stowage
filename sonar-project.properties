sonar.organization=stowage-js
sonar.projectKey=stowage-js_stowage

# The whole repository stays under analysis, as under automatic analysis; the tests are told
# apart so that they count neither as code to cover nor towards duplication.
sonar.sources=.
sonar.tests=.
sonar.exclusions=**/*.test.ts,**/dist/**,**/node_modules/**,coverage/**
sonar.test.inclusions=**/*.test.ts

# The same scope as `coverage.include` in `vitest.config.ts`: only the packages' sources
# are measured, so everything else would read as uncovered.
sonar.coverage.exclusions=harness/**,scripts/**,spikes/**,test/**,*.config.ts,packages/*/src/stubs.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
