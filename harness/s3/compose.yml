# ADR 0012: the endpoint every commit runs against. The digest is what CI starts and
# what green means, so the tag beside it is a label rather than what is resolved.
services:
  s3:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -ip.bind=0.0.0.0
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    # The suite writes below a prefix of its own and a run starts from an empty store, so
    # nothing here outlives the container.
    tmpfs:
      - /data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=/dev/null",
          "http://127.0.0.1:9333/cluster/healthz",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
