name: Conformance (full)

# ADR 0012, ADR 0023 and ADR 0034: both tiers against a real AWS S3 bucket, a real R2 bucket, a
# real Azure Blob Storage account and a real GCS bucket, on a schedule, on demand and before a
# release. A pull request never reaches this workflow: GitHub hands a run from a fork no secret
# and no OIDC token, so the real endpoints cannot be part of the pull request gate.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  # For a release workflow to call before it publishes.
  workflow_call:

concurrency:
  group: conformance-full-${{ github.ref }}
  cancel-in-progress: false
  # A called run takes the caller's `github.ref` and so shares this group with the schedule.
  # Without a queue a later trigger cancels the one run waiting, and a release waiting on it
  # would be skipped without a failure to show for it.
  queue: max

permissions:
  contents: read

env:
  # ADR 0006: the scheduled run asks for both tiers; the per-commit run is the `fast` one.
  STOWAGE_CONFORMANCE_INCLUDE_SLOW: "true"

jobs:
  # ADR 0012, ADR 0023, ADR 0026, ADR 0034 and ADR 0039: both tiers against each real endpoint
  # on the three runtimes. Spec 2: Node and `workerd` are the pair that differ most in how they
  # fetch, so they are the runtimes that meet TLS, latency and redirects of a real endpoint.
  real-endpoints:
    name: ${{ matrix.runtime }} against ${{ matrix.endpoint }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Each provider is an environment holding its own endpoint and credential, so that one
    # set of steps serves all four and a credential reaches the jobs of its own provider
    # alone.
    environment: ${{ matrix.provider }}
    permissions:
      contents: read
      # The job's OIDC token, whose subject names the environment the two managed identities
      # of the Azure account trust, and whose `environment` claim the workload identity pool
      # of the GCS bucket admits. No identity trusts the S3 and R2 environments, so the token
      # those jobs could take is exchanged for nothing.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        provider: [aws-s3, r2, azure-blob, gcs]
        runtime: [Node 24, Node 26, workerd]
        include:
          # `tier` names the endpoint tier of `STOWAGE_CONFORMANCE_ENDPOINTS` and the
          # harness directory of the Node run alike.
          - provider: aws-s3
            endpoint: AWS S3
            tier: s3
          - provider: r2
            endpoint: Cloudflare R2
            tier: s3
          - provider: azure-blob
            endpoint: Azure Blob
            tier: azure-blob
          - provider: gcs
            endpoint: GCS
            tier: gcs
          # The limits of spec 7.8 and 8.7 are the service's and no property of the Node
          # line, so one line uploads the 5 GiB. The account key is for the test that holds
          # Shared Key against the account, which does not run on `workerd`.
          - runtime: Node 24
            slug: node-24
            node: "24"
            copy-above-limit: "true"
            account-key: true
          - runtime: Node 26
            slug: node-26
            node: "26"
            account-key: true
          - runtime: workerd
            slug: workerd
            node: "24"
    # Every job gets the variables of both tiers. The environment fills those of its own
    # provider and leaves the others empty, and `STOWAGE_CONFORMANCE_ENDPOINTS` keeps the
    # other tier out of the run rather than failing its endpoint check.
    env:
      STOWAGE_CONFORMANCE_ENDPOINTS: ${{ matrix.tier }}
      STOWAGE_S3_ENDPOINT_NAME: ${{ matrix.provider }}
      STOWAGE_S3_ENDPOINT: ${{ vars.STOWAGE_S3_ENDPOINT }}
      STOWAGE_S3_BUCKET: ${{ vars.STOWAGE_S3_BUCKET }}
      STOWAGE_S3_REGION: ${{ vars.STOWAGE_S3_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.STOWAGE_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STOWAGE_S3_SECRET_ACCESS_KEY }}
      STOWAGE_S3_DENIED_ACCESS_KEY_ID: ${{ secrets.STOWAGE_S3_DENIED_ACCESS_KEY_ID }}
      STOWAGE_S3_DENIED_SECRET_ACCESS_KEY: ${{ secrets.STOWAGE_S3_DENIED_SECRET_ACCESS_KEY }}
      STOWAGE_S3_COPY_ABOVE_LIMIT: ${{ matrix.copy-above-limit }}
      STOWAGE_AZURE_BLOB_ENDPOINT_NAME: ${{ matrix.provider }}
      STOWAGE_AZURE_BLOB_ACCOUNT: ${{ vars.STOWAGE_AZURE_BLOB_ACCOUNT }}
      STOWAGE_AZURE_BLOB_CONTAINER: ${{ vars.STOWAGE_AZURE_BLOB_CONTAINER }}
      STOWAGE_AZURE_BLOB_TENANT_ID: ${{ vars.STOWAGE_AZURE_BLOB_TENANT_ID }}
      STOWAGE_AZURE_BLOB_CLIENT_ID: ${{ vars.STOWAGE_AZURE_BLOB_CLIENT_ID }}
      STOWAGE_AZURE_BLOB_DENIED_CLIENT_ID: ${{ vars.STOWAGE_AZURE_BLOB_DENIED_CLIENT_ID }}
      AZURE_STORAGE_KEY: ${{ matrix.account-key && secrets.STOWAGE_AZURE_BLOB_ACCOUNT_KEY || '' }}
      STOWAGE_AZURE_BLOB_COPY_ABOVE_LIMIT: ${{ matrix.copy-above-limit }}
      # ADR 0034: no secret, since the bucket's token comes from the job's OIDC token.
      STOWAGE_GCS_ENDPOINT_NAME: ${{ matrix.provider }}
      STOWAGE_GCS_BUCKET: ${{ vars.STOWAGE_GCS_BUCKET }}
      STOWAGE_GCS_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.STOWAGE_GCS_WORKLOAD_IDENTITY_PROVIDER }}
      STOWAGE_GCS_SERVICE_ACCOUNT: ${{ vars.STOWAGE_GCS_SERVICE_ACCOUNT }}
      STOWAGE_GCS_DENIED_SERVICE_ACCOUNT: ${{ vars.STOWAGE_GCS_DENIED_SERVICE_ACCOUNT }}
    steps:
      # ADR 0012: the token is taken first, and the harness hands it to the `Expired` case
      # once the expiration STS returned and a margin have passed. Azure and GCS have no such
      # token and R2 cannot pass the case (ADR 0045), so it reports itself skipped on all three.
      - name: Take a 900-second STS token
        if: matrix.provider == 'aws-s3'
        run: |
          token="$(aws sts get-session-token --duration-seconds 900 --region "$STOWAGE_S3_REGION" --output json)"
          secret_access_key="$(jq --raw-output .Credentials.SecretAccessKey <<<"$token")"
          session_token="$(jq --raw-output .Credentials.SessionToken <<<"$token")"
          echo "::add-mask::$secret_access_key"
          echo "::add-mask::$session_token"
          {
            echo "STOWAGE_S3_EXPIRED_ACCESS_KEY_ID=$(jq --raw-output .Credentials.AccessKeyId <<<"$token")"
            echo "STOWAGE_S3_EXPIRED_SECRET_ACCESS_KEY=$secret_access_key"
            echo "STOWAGE_S3_EXPIRED_SESSION_TOKEN=$session_token"
            echo "STOWAGE_S3_EXPIRED_AT=$(jq --raw-output .Credentials.Expiration <<<"$token")"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # A real endpoint answers in round trips over the internet, the 5 GiB copy of spec 7.8
      # and the 5,000 MiB one of spec 8.7 take minutes, and the `Expired` case waits out the
      # token: the per-commit timeouts measure none of that.
      - name: Run both tiers
        run: >-
          ${{ matrix.runtime == 'workerd'
          && 'pnpm --filter @stowage/harness-workerd exec vitest run'
          || format('pnpm exec vitest run harness/node harness/{0}', matrix.tier) }}
          --testTimeout=2400000
          --hookTimeout=600000
          --reporter=default
          --reporter=json
          --outputFile.json="$GITHUB_WORKSPACE/results.json"

      # A job that died before Vitest wrote its report still gets its column, which then
      # reads every point it was asked as not run rather than dropping out of the table.
      - name: Keep a report for a run that wrote none
        if: always()
        run: test -f results.json || echo '{"testResults":[]}' > results.json

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.provider }}-${{ matrix.slug }}
          path: results.json

  # ADR 0012: Bun and Deno run against the emulator. Their columns are covered by the same
  # suite, answered by the pinned image rather than by a provider. ADR 0023 carries that
  # over to Azure Blob, with Azurite beside SeaweedFS, and ADR 0039 to GCS, with
  # fake-gcs-server beside both.
  emulators:
    name: ${{ matrix.name }} against SeaweedFS, Azurite and fake-gcs-server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # `bun test` stops a test after five seconds, which leaves the thousand-object
          # cases of the slow tier little room on a shared runner.
          - name: Bun
            command: pnpm --filter @stowage/harness-bun exec bun test src --timeout 600000
          - name: Deno
            command: pnpm run test:deno
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - if: matrix.name == 'Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - if: matrix.name == 'Deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Start the S3 endpoint
        run: ./harness/s3/start.sh | sed 's/^export //' >> "$GITHUB_ENV"

      # Bun trusts the certificate `start.sh` generated through `NODE_EXTRA_CA_CERTS`, Deno
      # through `DENO_CERT`, both from this environment.
      - name: Start the Azure Blob endpoint
        run: ./harness/azure-blob/start.sh | sed 's/^export //' >> "$GITHUB_ENV"

      - name: Start the GCS endpoint
        run: ./harness/gcs/start.sh | sed 's/^export //' >> "$GITHUB_ENV"

      - run: ${{ matrix.command }}

      - name: Stop the S3 endpoint
        if: always()
        run: ./harness/s3/stop.sh

      - name: Stop the Azure Blob endpoint
        if: always()
        run: ./harness/azure-blob/stop.sh

      - name: Stop the GCS endpoint
        if: always()
        run: ./harness/gcs/stop.sh

  # Spec 6 and ADR 0010: `adapter-fs` on macOS, as the per-commit run has it, with both tiers.
  # The runners have no Docker, so the endpoint tiers stay out (ADR 0012). This job's name
  # differs from the macOS jobs of `ci.yml` because `main` requires those by name, and a run
  # dispatched on a pull request's branch would otherwise answer for them.
  macos:
    name: ${{ matrix.name }} against the macOS file system
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Vitest and `bun test` stop a test after five seconds, which leaves the
          # thousand-object cases of the slow tier little room on a shared runner.
          - name: Node 24
            node: "24"
            command: pnpm exec vitest run harness/node --testTimeout=600000
          - name: Node 26
            node: "26"
            command: pnpm exec vitest run harness/node --testTimeout=600000
          - name: Bun
            node: "24"
            command: pnpm --filter @stowage/harness-bun exec bun test src --timeout 600000
          - name: Deno
            node: "24"
            command: pnpm run test:deno
    env:
      STOWAGE_CONFORMANCE_ENDPOINTS: none
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - if: matrix.name == 'Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - if: matrix.name == 'Deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: ${{ matrix.command }}

  # Spec 18: the run reports on each point it settles, one column per endpoint and runtime.
  report:
    name: Report on spec 18
    needs: [real-endpoints]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The report reads the JSON files and imports nothing it would need installed.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # A called run shares its artifacts with the caller's jobs, such as the publish plan and
      # the packed tarballs of a release, and the report reads every directory as a column.
      - uses: actions/download-artifact@v8
        with:
          pattern: "{aws-s3,r2,azure-blob,gcs}-*"
          path: results

      - run: node harness/s3/src/first-run-report.ts results >> "$GITHUB_STEP_SUMMARY"
