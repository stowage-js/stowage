name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ADR 0008: the type-aware lint rules read the declarations of the other
      # packages, so the build runs before the checks that resolve them.
      - run: pnpm run build

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run format:check

      # ADR 0012: the suite runs against the pinned endpoint per commit, so the run that
      # starts it is the run that says what green means. `start.sh` prints the
      # environment as `export NAME=value`, which `GITHUB_ENV` takes without the keyword.
      - name: Start the S3 endpoint
        run: ./harness/s3/start.sh | sed 's/^export //' >> "$GITHUB_ENV"

      # Spec 2: `test` holds the Node column and the `workerd` one, whose results Vitest
      # reports on Node. Bun and Deno are columns of their own, in the job below.
      - run: pnpm run test

      - name: Stop the S3 endpoint
        if: always()
        run: ./harness/s3/stop.sh

  runtimes:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Bun
            script: test:bun
          - name: Deno
            script: test:deno
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Node is a tool here and not the runtime under test: pnpm installs with it, and the
      # harnesses import `@stowage/core` from the `dist` that its build writes.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      # Spec 1: Bun and Deno have no floor. These two files pin the version the harnesses
      # run on, which is the version each README names as the one CI last ran green.
      - if: matrix.name == 'Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - if: matrix.name == 'Deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # ADR 0012, as in the job above.
      - name: Start the S3 endpoint
        run: ./harness/s3/start.sh | sed 's/^export //' >> "$GITHUB_ENV"

      - run: pnpm run ${{ matrix.script }}

      - name: Stop the S3 endpoint
        if: always()
        run: ./harness/s3/stop.sh
