name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "24"
            version: "24"
          # Since Node 26.11.0 a `Request` pulls once from an async-iterable body before anyone
          # reads it. Next.js hands `next start`'s `IncomingMessage` over as that body, which
          # then keeps Node from draining what a route answered without reading, and the
          # keep-alive connection stalls: `upload/content-encoding` hangs after
          # `upload/max-size`. Back to "26" once nodejs/undici#5988 is fixed in a Node 26
          # release. The job keeps its name, which `main` requires.
          - node: "26"
            version: "26.10.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ADR 0008: the type-aware lint rules read the declarations of the other
      # packages, so the build runs before the checks that resolve them.
      - run: pnpm run build

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run format:check

      # ADR 0012: the suite runs against the pinned endpoint per commit, so the run that
      # starts it is the run that says what green means. `start.sh` prints the
      # environment as `export NAME=value`, which `GITHUB_ENV` takes without the keyword.
      - name: Start the S3 endpoint
        run: ./harness/s3/start.sh | sed 's/^export //' >> "$GITHUB_ENV"

      # ADR 0023: Azurite beside SeaweedFS. Its environment carries `NODE_EXTRA_CA_CERTS`,
      # which the Node of every later step reads at its start to trust the certificate
      # `start.sh` generated.
      - name: Start the Azure Blob endpoint
        run: ./harness/azure-blob/start.sh | sed 's/^export //' >> "$GITHUB_ENV"

      # ADR 0034: fake-gcs-server beside SeaweedFS and Azurite.
      - name: Start the GCS endpoint
        run: ./harness/gcs/start.sh | sed 's/^export //' >> "$GITHUB_ENV"

      # Spec 2: `test` holds the Node column. Bun, Deno and `workerd` are columns of their
      # own, in the job below. Only Node 24 measures coverage, for the `sonar` job.
      - run: pnpm run test ${{ matrix.node == '24' && '--coverage' || '' }}

      - if: matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          # A re-run of the run's failed jobs, days later, still finds the report.
          retention-days: 7
          overwrite: true

      # Spec 2: `test` runs the Hono, NestJS and Next.js cells at the newest release of each
      # framework's major, and this runs them again at the floor of each integration's peer
      # range, on each Node line alike.
      - run: pnpm run test:floors

      - name: Stop the S3 endpoint
        if: always()
        run: ./harness/s3/stop.sh

      - name: Stop the Azure Blob endpoint
        if: always()
        run: ./harness/azure-blob/stop.sh

      - name: Stop the GCS endpoint
        if: always()
        run: ./harness/gcs/stop.sh

  # ADR 0069: the code-block test compiles the README against the workspace and runs nothing,
  # so neither a tarball missing a file nor a block failing at run time would show there.
  quickstart:
    name: Quickstart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run test:quickstart

  # SonarQube Cloud's automatic analysis reads no coverage report, so the scan runs here, on
  # the report of the Node 24 run. A pull request from a fork gets no `SONAR_TOKEN`, so it
  # gets no scan either.
  sonar:
    name: SonarQube Cloud
    needs: checks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # SonarQube Cloud tells new code from old by the history and the blame.
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage

      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  runtimes:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Bun
            script: test:bun
          - name: Deno
            script: test:deno
          - name: workerd
            script: test:workerd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # Node is a tool here and not the runtime under test: pnpm installs with it, the
      # harnesses import `@stowage/core` from the `dist` its build writes, and the `workerd`
      # harness bundles its worker and reports the results on it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      # Spec 1: Bun and Deno have no floor. These two files pin the version the harnesses
      # run on, which is the version each README names as the one CI last ran green.
      - if: matrix.name == 'Bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - if: matrix.name == 'Deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # ADR 0012, as in the job above.
      - name: Start the S3 endpoint
        run: ./harness/s3/start.sh | sed 's/^export //' >> "$GITHUB_ENV"

      # ADR 0023: each runtime trusts the certificate `start.sh` generated the way it
      # trusts a CA of its own. Bun reads `NODE_EXTRA_CA_CERTS` and Deno `DENO_CERT`, both
      # from this environment, and the `workerd` harness hands the file to `workerd.capnp`.
      - name: Start the Azure Blob endpoint
        run: ./harness/azure-blob/start.sh | sed 's/^export //' >> "$GITHUB_ENV"

      # ADR 0034, ADR 0039: fake-gcs-server beside SeaweedFS and Azurite, over plain HTTP,
      # so no runtime has a certificate to trust.
      - name: Start the GCS endpoint
        run: ./harness/gcs/start.sh | sed 's/^export //' >> "$GITHUB_ENV"

      - run: pnpm run ${{ matrix.script }}

      - name: Stop the S3 endpoint
        if: always()
        run: ./harness/s3/stop.sh

      - name: Stop the Azure Blob endpoint
        if: always()
        run: ./harness/azure-blob/stop.sh

      - name: Stop the GCS endpoint
        if: always()
        run: ./harness/gcs/stop.sh

  # Spec 6 promises `adapter-fs` on macOS, whose file system refuses names Linux holds, and
  # ADR 0010 counts that as supported only where CI covers it. ADR 0012: GitHub's macOS
  # runners have no Docker, so these runs leave the endpoint tiers out and run the cells
  # that need no endpoint. `main` requires these jobs by name, so a new name must stay apart
  # from the macOS jobs of `conformance-full.yml`, and the required checks follow it.
  macos:
    name: ${{ matrix.name }} on macOS
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The tests of `adapter-fs` itself hold what only APFS does, beside the harness.
          - name: Node 24
            node: "24"
            command: pnpm exec vitest run packages/adapter-fs harness/node
          - name: Node 26
            node: "26"
            command: pnpm exec vitest run packages/adapter-fs harness/node
          - name: Bun
            node: "24"
            command: pnpm run test:bun
          - name: Deno
            node: "24"
            command: pnpm run test:deno
    env:
      STOWAGE_CONFORMANCE_ENDPOINTS: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - if: matrix.name == 'Bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - if: matrix.name == 'Deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: ${{ matrix.command }}
